<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <title>東南亞七日</title>
    <!-- Redirect unknown paths back to index.html, preserving the path as a query string.
         pathSegmentsToKeep=1 keeps the /bkk-laos-2026 repo prefix intact. -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
